let shaftTop=project(0,0,cameraY-H/scale),shaftBottom=project(0,0,cameraY+H/scale);let shaftW=innerR*2*scale;let g=ctx.createLinearGradient(centerX-shaftW/2,0,centerX+shaftW/2,0);g.addColorStop(0,'#cbd0d9');g.addColorStop(.24,'#ffffff');g.addColorStop(.7,'#f7f8fa');g.addColorStop(1,'#c8cdd6');ctx.fillStyle=g;ctx.fillRect(centerX-shaftW/2,0,shaftW,H);ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(centerX-shaftW*.18,0,shaftW*.12,H);

// Landing marker: a soft shadow indicates the next platform directly below the ball.
if(alive){let landing=platforms.find(p=>!p.passed&&p.y>ballY+contactRadius&&p.y-ballY<spacing*1.6);if(landing&&!inGap(landing)){let pt=project(ballX,ballZ,landing.y-2),distance=Math.max(0,landing.y-ballY);ctx.save();ctx.globalAlpha=.24*Math.max(.2,1-distance/(spacing*1.6));ctx.fillStyle="#22343b";ctx.beginPath();ctx.ellipse(pt.x,pt.y,17*scale,5*scale,0,0,TAU);ctx.fill();ctx.restore()}}
let ballPoint=project(ballX,ballZ,ballY),bx=ballPoint.x,by=ballPoint.y;
if(alive&&Fever.active(feverState)){
 ctx.save();let glow=ctx.createRadialGradient(bx,by,radius*scale*.5,bx,by,radius*scale*2.6);
 glow.addColorStop(0,'rgba(255,228,85,.45)');glow.addColorStop(1,'rgba(255,165,37,0)');
 ctx.fillStyle=glow;ctx.beginPath();ctx.arc(bx,by,radius*scale*2.6,0,TAU);ctx.fill();
 ctx.strokeStyle='rgba(255,200,63,.9)';ctx.lineWidth=2.3*scale;ctx.beginPath();ctx.arc(bx,by,radius*scale*1.16,0,TAU);ctx.stroke();ctx.restore();
}
// Very subtle contact feedback: a translucent halo below the bouncing ball.
if(alive&&vy<0){ctx.save();ctx.globalAlpha=Math.min(.16,Math.abs(vy)*.012);ctx.strokeStyle='#66c86e';ctx.lineWidth=2*scale;ctx.beginPath();ctx.ellipse(bx,by+radius*scale,18*scale,5*scale,0,0,TAU);ctx.stroke();ctx.restore()}
for(let t of trail){let alpha=t.life/16;ctx.fillStyle=`rgba(59,183,86,${alpha*.24})`;ctx.beginPath();ctx.arc(t.x,t.y,Math.max(1,radius*scale*alpha*.8),0,TAU);ctx.fill()}for(let q of particles){ctx.globalAlpha=Math.max(0,Math.min(1,q.life/(q.maxLife||42)));ctx.fillStyle=q.color||'#8cdb5c';if(q.shard){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.spin);let sz=q.size*scale;ctx.fillRect(-sz*.5,-sz*.36,sz,sz*.72);ctx.restore()}else{ctx.beginPath();ctx.arc(q.x,q.y,q.size*scale,0,TAU);ctx.fill()}}ctx.globalAlpha=1;
for(let popup of popups){ctx.save();ctx.globalAlpha=Math.min(1,popup.life/18);ctx.font=`900 ${Math.round(20*scale)}px system-ui`;ctx.textAlign='center';ctx.lineWidth=3*scale;ctx.strokeStyle='#203b35';ctx.strokeText(popup.text,popup.x,popup.y);ctx.fillStyle=popup.color;ctx.fillText(popup.text,popup.x,popup.y);ctx.restore()}
ctx.save();ctx.translate(bx,by);ctx.scale(1+squash*.65,1-squash*.45);ctx.shadowColor='#192b2c55';ctx.shadowBlur=7*scale;ctx.shadowOffsetY=3*scale;let r=radius*scale;let melon=ctx.createRadialGradient(-r*.4,-r*.5,r*.05,0,0,r);melon.addColorStop(0,'#baf35e');melon.addColorStop(.55,'#53c842');melon.addColorStop(1,'#116f39');ctx.fillStyle=melon;ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();ctx.shadowColor='transparent';ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.clip();for(let i=-2;i<=2;i++){ctx.beginPath();ctx.strokeStyle=i%2?'#195e35':'#277b36';ctx.lineWidth=3.2*scale;ctx.moveTo(i*6*scale-r*.15,-r*1.2);ctx.bezierCurveTo(i*4*scale-r*.3,-r*.2,i*7*scale+r*.25,r*.3,i*5*scale+r*.15,r*1.2);ctx.stroke()}ctx.restore();ctx.restore();if(combo>=2&&vy>5){ctx.save();ctx.globalAlpha=Math.min(.6,(combo-1)*.12);ctx.strokeStyle='#67d95e';ctx.lineWidth=3*scale;ctx.beginPath();ctx.moveTo(bx,by-15*scale);ctx.lineTo(bx,by-48*scale-Math.min(vy,14)*2);ctx.stroke();ctx.restore()}if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash/20*.45})`;ctx.fillRect(0,0,W,H);flash--}}function end(win=false){sfx(win?'win':'lose');alive=false;started=false;saveBest();levelFinishing=win;mode=win?'leveldone':'gameover';pauseBtn.style.display='none';if(win)levelsCompleted++;showPanel(win?`Nível ${level} concluído!`:'Fim de jogo',win?`Boa! Você superou ${levelTarget} plataformas. Prepare-se para um novo padrão de aberturas.`:'Você atingiu uma área perigosa. Tente alinhar a abertura antes da queda.',win?'Próximo nível':'Tentar novamente',true)}
function completePlatform(p,cause='gap'){
 p.passed=true;levelPassed++;combo++;
 const activated=cause==='gap'&&Fever.onGap(feverState);
 const powered=Fever.active(feverState);
 const streakReward=combo===3?20:combo===5?50:combo===8?100:0;
 const basePoints=10+(combo>=2?Math.min(combo-1,5)*5:0)+(p.special==='bonus'?30:0)+streakReward;
 const points=basePoints*Fever.multiplier(feverState);
 totalScore+=points;saveBest();scoreEl.textContent=totalScore;
 progressFill.style.width=(levelPassed/levelTarget*100)+'%';
 refreshFeverHud();
 if(activated){
  flash=12;shake=3.5;sfx('fever');
  floatingText('FEVER ATIVADO!',project(ballX,ballZ,ballY).x,project(ballX,ballZ,ballY).y-57*scale,'#ffc748');
 } else if(!p.broken)sfx(p.special==='bonus'?'bonus':combo>=3?'combo':'pass');
 if(combo>=2||powered){
  floatingText(streakReward?'SEQUÊNCIA! +'+points:'+'+points,project(ballX,ballZ,ballY).x,project(ballX,ballZ,ballY).y-35*scale,powered?'#ffc748':combo>=3?'#f6c84e':'#6ce287');
  comboBadge.textContent=powered?'FEVER x2  •  COMBO '+combo:streakReward?'COMBO x'+combo+'  +'+streakReward+' BÔNUS':'COMBO x'+combo+'  +'+points;
  comboBadge.classList.add('on');
 }else comboBadge.classList.remove('on');
 burst(project(ballX,ballZ,ballY).x,project(ballX,ballZ,ballY).y,powered?13:combo>=3?12:6);
 if(levelPassed>=levelTarget){flash=9;end(true)}
}
function simulateStep(){if(mode==='playing'&&alive&&started){Fever.tick(feverState);if(frames%6===0)refreshFeverHud();let prev=ballY;vy=Math.min(vy+gravity,14);ballY+=vy;for(let p of platforms){if(p.passed||vy<=0)continue;if(prev+contactRadius<=p.y&&ballY+contactRadius>=p.y){const collision=Fever.contact(feverState,{gap:inGap(p),danger:dangerAt(p),fragile:p.special==='fragile'});
if(collision==='gap'){completePlatform(p,'gap');break}
if(collision==='lose'){end();break}
if(collision==='smash'){
 p.broken=true;fragments(p);completePlatform(p,'smash');
 sfx('break');shake=4;break
}
ballY=p.y-contactRadius;vy=bounce;squash=.55;sfx('bounce');combo=0;
Fever.onBounce(feverState);refreshFeverHud();
comboBadge.classList.remove('on');shake=2.4;burst(project(ballX,ballZ,ballY).x,project(ballX,ballZ,ballY).y+radius*scale,9);break}}cameraY+=(ballY+ballZ*.32/((1+ballZ*.0012)*verticalScale)-cameraY)*.13}squash*=.79;shake*=.8;for(let q of particles){q.x+=q.vx*scale;q.y+=q.vy*scale;q.vy+=q.shard?.19:.12;q.life--;if(q.shard)q.spin+=q.spinSpeed}particles=particles.filter(q=>q.life>0);if(particles.length>130)particles.splice(0,particles.length-130);for(let q of breakFx){q.dx+=q.vx;q.dz+=q.vz;q.dy+=q.vy;q.vy+=.23;q.rot+=q.rv;q.life--}breakFx=breakFx.filter(q=>q.life>0);if(breakFx.length>70)breakFx.splice(0,breakFx.length-70);for(let popup of popups){popup.y-=.7*scale;popup.life--}popups=popups.filter(x=>x.life>0);for(let t of trail)t.life--;trail=trail.filter(t=>t.life>0);if(started&&alive&&vy>8&&combo>=2&&frames%2===0)trail.push({x:project(ballX,ballZ,ballY).x,y:project(ballX,ballZ,ballY).y-12*scale,life:16});frames++}
let lastFrameTime=null,frameAccumulator=0;
const fixedFrameMs=1000/60;
function update(timestamp){
  if(lastFrameTime===null)lastFrameTime=timestamp;
  const elapsed=Math.min(Math.max(timestamp-lastFrameTime,0),50);
  lastFrameTime=timestamp;
  frameAccumulator+=elapsed;
  let steps=0;
  while(frameAccumulator>=fixedFrameMs&&steps<3){
    simulateStep();
    frameAccumulator-=fixedFrameMs;
    steps++;
  }
  if(steps===3&&frameAccumulator>=fixedFrameMs)frameAccumulator=0;
  draw();
  requestAnimationFrame(update);
}
function down(e){if(mode!=='playing'||!alive)return;drag=true;lastX=e.clientX;initAudio();started=true;hint.style.opacity='0';canvas.setPointerCapture?.(e.pointerId)}function move(e){if(!drag||mode!=='playing')return;let delta=e.clientX-lastX;lastX=e.clientX;rotation+=delta*.012;rotation=norm(rotation)}function up(){drag=false}canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);function startGame(next=false){if(next){level++;buildLevel(level)}else{reset()}mode='playing';alive=true;started=false;overlay.style.display='none';pauseBtn.style.display='block';hint.style.opacity='1';refreshBest()}
restartBtn.onclick=()=>{initAudio();if(mode==='paused'||mode==='help'){mode='playing';alive=true;overlay.style.display='none';pauseBtn.style.display='block';hint.style.opacity=started?'0':'1'}else if(mode==='leveldone')startGame(true);else startGame(false)};
menuBtn.onclick=()=>menu();
